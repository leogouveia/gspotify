name: Release GSpotify Lab

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'leogouveia/gspotify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag on main history
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell gjs libglib2.0-bin nodejs
      - name: Build and verify release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 scripts/package.py --release-tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 \
            --verify-tag --title "GSpotify Lab $RELEASE_TAG" --generate-notes
